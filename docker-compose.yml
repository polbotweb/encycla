# Production stack. See docs/DEPLOYMENT.md §7.
#   cp .env.example .env   # then set NODE_ENV=production, PUBLIC_ORIGIN, ADMIN_TOKEN…
#   docker compose up -d --build                     # app only, on 127.0.0.1:3000
#   docker compose --profile proxy up -d --build     # app + Caddy (HTTPS on 80/443, needs DOMAIN)
# TikTok connector (optional, AGPL-3.0): WITH_TIKTOK=true docker compose up -d --build
services:
  encycla:
    build:
      context: .
      args:
        WITH_TIKTOK: ${WITH_TIKTOK:-false}
    image: encycla:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_PATH: /app/data/db/encycla.db
      IMAGE_CACHE_DIR: /app/data/image-cache
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - encycla-data:/app/data/db
      # Proxied Commons images (D-107), disposable: size capped by IMAGE_CACHE_MAX_MB.
      - encycla-image-cache:/app/data/image-cache
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    profiles: ['proxy']
    restart: unless-stopped
    depends_on:
      encycla:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  encycla-data:
  encycla-image-cache:
  caddy-data:
  caddy-config:
