name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run data:validate
      - run: pnpm test
      - run: pnpm audit --prod
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the default image (without the TikTok connector)
        run: docker build -t encycla:ci .
      - name: The optional AGPL connector is not in the default image
        run: |
          ! docker run --rm --entrypoint sh encycla:ci -c 'ls node_modules/.pnpm | grep -q tiktok-live-connector'
      - name: Production refuses to start without a strong ADMIN_TOKEN
        run: |
          set +e
          out=$(docker run --rm -e NODE_ENV=production -e ADMIN_TOKEN=change-me -e PUBLIC_ORIGIN=https://example.test encycla:ci 2>&1)
          code=$?
          echo "$out"
          test "$code" -ne 0 && echo "$out" | grep -q 'ADMIN_TOKEN'
      - name: Build the image with the TikTok connector
        run: |
          docker build --build-arg WITH_TIKTOK=true -t encycla:ci-tiktok .
          docker run --rm --entrypoint node encycla:ci-tiktok -e "import('tiktok-live-connector').then(m => process.exit(typeof m.TikTokLiveConnection === 'function' ? 0 : 1))"
